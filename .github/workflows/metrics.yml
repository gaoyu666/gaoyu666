# 生成 Metrics 全景信息图（每天自动更新）
# 依赖：lowlighter/metrics
# 产出：github-metrics.svg（README 里直接引用）
#
# 说明：
# - 默认使用 ${{ secrets.GITHUB_TOKEN }}，只统计公开数据，开箱即用
# - 想统计私有仓库贡献：创建一个 PAT（勾选 repo 全权限 + read:user），
#   存为仓库 Secret 名 METRICS_TOKEN，并把下面 token 的值改成 ${{ secrets.METRICS_TOKEN }}
name: Generate Metrics

on:
  schedule:
    - cron: "30 0 * * *"  # 每天 UTC 0:30（北京时间 8:30）
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: lowlighter/metrics@latest
        with:
          filename: github-metrics.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Shanghai
          config_display: large
          repositories_forks: true
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_habits: yes
          plugin_habits_from: 500
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_followup: yes
          plugin_stars: yes
          plugin_stars_limit: 3
          plugin_screenshot: no

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .
          if git commit -m "chore: update metrics"; then
            git push
          else
            echo "No changes to commit"
          fi
