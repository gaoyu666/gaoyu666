# 生成贪吃蛇动画（每天自动更新）
# 依赖：Platane/snk
# 产出：dist/github-snake.svg（浅色） + dist/github-snake-dark.svg（深色）
# README 用 <picture> 标签按系统深浅色自动切换
name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"   # 每天 UTC 0:00（北京时间 8:00）
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate snake animations
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/
          if git commit -m "chore: update snake animation"; then
            git push
          else
            echo "No changes to commit"
          fi
